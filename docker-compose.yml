services:
  inventoryservice:
    image: cppboostnativeexample-inventoryservice:latest
    build:
      context: .
      target: inventoryservice
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        DEPENDENCY_DOCKER_REGISTRY: ${DEPENDENCY_DOCKER_REGISTRY:-docker.io}
        SERVICEGEN_APT_UBUNTU_ARCHIVE_URL: ${SERVICEGEN_APT_UBUNTU_ARCHIVE_URL:-}
        SERVICEGEN_APT_UBUNTU_SECURITY_URL: ${SERVICEGEN_APT_UBUNTU_SECURITY_URL:-}
        SERVICEGEN_APT_UBUNTU_PORTS_URL: ${SERVICEGEN_APT_UBUNTU_PORTS_URL:-}
        SERVICEGEN_CONAN_REMOTE_URL: ${SERVICEGEN_CONAN_REMOTE_URL:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    environment:
      NATIVE_WORKER_THREADS: ${BENCHMARK_SERVICE_CORES:-2}
      INVENTORY_SERVICE_RESPONSE_DELAY: ${INVENTORY_SERVICE_RESPONSE_DELAY:-0s}
    ports:
      - "9092:9092"
      - "9202:9202"
    security_opt: [seccomp:unconfined]
    cap_add: [SYS_PTRACE]
    networks: [app_net]

  orderservice:
    image: cppboostnativeexample-orderservice:latest
    build:
      context: .
      target: orderservice
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        DEPENDENCY_DOCKER_REGISTRY: ${DEPENDENCY_DOCKER_REGISTRY:-docker.io}
        SERVICEGEN_APT_UBUNTU_ARCHIVE_URL: ${SERVICEGEN_APT_UBUNTU_ARCHIVE_URL:-}
        SERVICEGEN_APT_UBUNTU_SECURITY_URL: ${SERVICEGEN_APT_UBUNTU_SECURITY_URL:-}
        SERVICEGEN_APT_UBUNTU_PORTS_URL: ${SERVICEGEN_APT_UBUNTU_PORTS_URL:-}
        SERVICEGEN_CONAN_REMOTE_URL: ${SERVICEGEN_CONAN_REMOTE_URL:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    environment:
      NATIVE_WORKER_THREADS: ${BENCHMARK_SERVICE_CORES:-2}
      INVENTORY_SERVICE_API_ADDRESS: ${INVENTORY_SERVICE_API_ADDRESS:-dns:///inventoryservice:9202}
      INVENTORY_SERVICE_API_CONNECTIONS_COUNT: ${INVENTORY_SERVICE_API_CONNECTIONS_COUNT:-1}
      ORDER_SERVICE_REQUEST_TIMEOUT: ${ORDER_SERVICE_REQUEST_TIMEOUT:-5s}
      ORDER_SERVICE_SOFT_DEADLINE_MARGIN: ${ORDER_SERVICE_SOFT_DEADLINE_MARGIN:-1s}
      NATIVE_DIAGNOSTIC_BYPASS_GRPC: ${NATIVE_DIAGNOSTIC_BYPASS_GRPC:-false}
    ports:
      - "9091:9091"
    depends_on: [inventoryservice]
    security_opt: [seccomp:unconfined]
    cap_add: [SYS_PTRACE]
    networks: [app_net]

networks:
  app_net:
    driver: bridge
