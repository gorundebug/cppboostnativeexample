services:
  inventoryservice:
    image: cppboostnativeexample-inventoryservice:latest
    build:
      context: .
      target: inventoryservice
      args:
        SERVICEGEN_GRPC_SOURCE_STAGE: grpc-source
        SERVICEGEN_ASIO_GRPC_SOURCE_STAGE: asio-grpc-source
      additional_contexts:
        grpc-source: ${SERVICEGEN_GRPC_SOURCE_CONTEXT:-.}
        asio-grpc-source: ${SERVICEGEN_ASIO_GRPC_SOURCE_CONTEXT:-.}
    environment:
      NATIVE_WORKER_THREADS: ${BENCHMARK_SERVICE_CORES:-2}
      INVENTORY_SERVICE_RESPONSE_DELAY: ${INVENTORY_SERVICE_RESPONSE_DELAY:-0s}
    ports:
      - "9092:9092"
      - "9202:9202"
    security_opt: [seccomp:unconfined]
    cap_add: [SYS_PTRACE]
    networks: [app_net]

  orderservice:
    image: cppboostnativeexample-orderservice:latest
    build:
      context: .
      target: orderservice
      args:
        SERVICEGEN_GRPC_SOURCE_STAGE: grpc-source
        SERVICEGEN_ASIO_GRPC_SOURCE_STAGE: asio-grpc-source
      additional_contexts:
        grpc-source: ${SERVICEGEN_GRPC_SOURCE_CONTEXT:-.}
        asio-grpc-source: ${SERVICEGEN_ASIO_GRPC_SOURCE_CONTEXT:-.}
    environment:
      NATIVE_WORKER_THREADS: ${BENCHMARK_SERVICE_CORES:-2}
      INVENTORY_SERVICE_API_ADDRESS: ${INVENTORY_SERVICE_API_ADDRESS:-dns:///inventoryservice:9202}
      INVENTORY_SERVICE_API_CONNECTIONS_COUNT: ${INVENTORY_SERVICE_API_CONNECTIONS_COUNT:-1}
      ORDER_SERVICE_REQUEST_TIMEOUT: ${ORDER_SERVICE_REQUEST_TIMEOUT:-5s}
      ORDER_SERVICE_SOFT_DEADLINE_MARGIN: ${ORDER_SERVICE_SOFT_DEADLINE_MARGIN:-1s}
      NATIVE_DIAGNOSTIC_BYPASS_GRPC: ${NATIVE_DIAGNOSTIC_BYPASS_GRPC:-false}
    ports:
      - "9091:9091"
    depends_on: [inventoryservice]
    security_opt: [seccomp:unconfined]
    cap_add: [SYS_PTRACE]
    networks: [app_net]

networks:
  app_net:
    driver: bridge
